#Gradle
# Heap raised to 8G: linking the Kotlin/Native iOS frameworks (debug + release)
# for all three modules in parallel is memory-hungry and OOM'd at 4G/6G —
# the release link of the largest module (the viewer) needs the most headroom.
# 8G is comfortable on a 16 GB+ machine; CI runners may need to lower this or
# pass `--max-workers=2` to cap concurrent native links. The
# HeapDumpOnOutOfMemoryError flag was dropped — each OOM wrote a ~6 GB .hprof
# to the repo root, and the dumps add nothing over the compiler's own error.
org.gradle.jvmargs=-Xmx8G -Xms1G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4G -Xms1G
kotlin.incremental=true
kotlin.native.ignoreDisabledTargets=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Compose
org.jetbrains.compose.experimental.uikit.enabled=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=true

# Silence KT-83319 — a JetBrains-confirmed-harmless false positive. With
# `com.android.kotlin.multiplatform.library` + the default hierarchy template,
# the Kotlin Gradle plugin reports `commonTest` as an "Unused Kotlin Source Set"
# even though the jvm and iOS test compilations DO consume it (e.g.
# `:pdfkmp:jvmTest` runs the full commonTest suite). No upstream fix is planned.
# Suppressing this one diagnostic is preferable to enabling Android host tests
# (`withHostTest {}`) on the published modules purely to satisfy a misfiring check.
# https://youtrack.jetbrains.com/issue/KT-83319
kotlin.suppressGradlePluginWarnings=UnusedSourceSetsWarning

android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false

