name: Docs

# Builds the documentation site — MkDocs (guides) + Dokka (API reference
# under /api) — and deploys it to GitHub Pages on every push to master.
# One-time repo setting: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newer pushes supersede in-flight deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate API reference (Dokka)
        run: ./gradlew :dokkaGenerate --stacktrace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site (MkDocs Material)
        run: |
          pip install mkdocs-material
          mkdocs build --strict
          # Serve the aggregated Dokka output under /api on the same site.
          cp -r build/dokka/html site/api

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
